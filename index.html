<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Luyện Thi Trắc Nghiệm Tin Học</title>
  <!-- Nhúng font Be Vietnam Pro tối ưu tiếng Việt -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #4338ca;
      --primary-gradient: linear-gradient(135deg, #4f46e5 0%, #3730a3 100%);
      --primary-hover: #3730a3;
      --primary-light: #e0e7ff;
      --accent: #06b6d4;
      --success: #059669;
      --success-bg: #ecfdf5;
      --danger: #dc2626;
      --danger-bg: #fef2f2;
      --bg: #f1f5f9;
      --card-bg: #ffffff;
      --text-main: #0f172a;
      --text-sub: #475569;
      --border: #e2e8f0;
      --shadow: 0 10px 25px -5px rgba(15, 23, 42, 0.08), 0 8px 10px -6px rgba(15, 23, 42, 0.04);
    }

    * { box-sizing: border-box; }
    body {
      font-family: 'Be Vietnam Pro', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      padding: 32px 16px;
      background: var(--bg);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    .container {
      width: 100%;
      max-width: 780px;
    }

    .card {
      background: var(--card-bg);
      border-radius: 24px;
      padding: 36px 32px;
      box-shadow: var(--shadow);
      border: 1px solid rgba(226, 232, 240, 0.8);
      position: relative;
    }

    /* Màn hình Menu */
    .menu-header { text-align: center; margin-bottom: 28px; }
    .badge-top {
      display: inline-block;
      font-size: 0.82rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--primary);
      background: var(--primary-light);
      padding: 6px 14px;
      border-radius: 9999px;
      margin-bottom: 12px;
    }
    .menu-header h1 {
      margin: 0 0 8px 0;
      font-size: 1.75rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: var(--text-main);
    }
    .menu-header p {
      margin: 0;
      color: var(--text-sub);
      font-size: 0.95rem;
    }

    .module-list {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .btn-module {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      padding: 18px 22px;
      background: #ffffff;
      border: 1.5px solid var(--border);
      border-radius: 16px;
      cursor: pointer;
      font-family: inherit;
      font-size: 1.02rem;
      font-weight: 600;
      color: var(--text-main);
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .btn-module:hover {
      border-color: var(--primary);
      background: #faf5ff;
      transform: translateY(-2px);
      box-shadow: 0 10px 20px -5px rgba(79, 70, 229, 0.12);
      color: var(--primary);
    }
    .btn-module .module-tag {
      font-size: 0.82rem;
      font-weight: 600;
      padding: 4px 10px;
      border-radius: 8px;
      background: var(--bg);
      color: var(--text-sub);
    }

    /* Màn hình Quiz */
    .quiz-nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }
    .btn-back {
      background: none;
      border: none;
      font-family: inherit;
      color: var(--text-sub);
      cursor: pointer;
      font-weight: 600;
      font-size: 0.92rem;
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 6px 10px;
      border-radius: 8px;
      transition: all 0.15s;
    }
    .btn-back:hover {
      background: var(--bg);
      color: var(--primary);
    }
    .score-badge {
      font-size: 0.92rem;
      font-weight: 600;
      color: var(--primary);
      background: var(--primary-light);
      padding: 5px 12px;
      border-radius: 9999px;
    }

    .progress-track {
      width: 100%;
      height: 6px;
      background: #e2e8f0;
      border-radius: 10px;
      overflow: hidden;
      margin-bottom: 24px;
    }
    .progress-bar {
      height: 100%;
      width: 0%;
      background: var(--primary-gradient);
      transition: width 0.35s ease;
    }

    .question-title {
      font-size: 1.25rem;
      font-weight: 700;
      line-height: 1.55;
      margin-bottom: 24px;
      color: #0f172a;
    }

    .options-box {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .btn-opt {
      width: 100%;
      text-align: left;
      padding: 16px 20px;
      border: 1.5px solid var(--border);
      border-radius: 14px;
      background: #ffffff;
      cursor: pointer;
      font-family: inherit;
      font-size: 0.98rem;
      color: var(--text-main);
      display: flex;
      align-items: flex-start;
      gap: 14px;
      transition: all 0.15s ease;
      line-height: 1.45;
    }
    .btn-opt:hover:not(:disabled) {
      border-color: #94a3b8;
      background: #f8fafc;
      transform: translateX(2px);
    }
    .btn-opt .opt-letter {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 26px;
      height: 26px;
      border-radius: 7px;
      background: var(--bg);
      font-weight: 700;
      font-size: 0.85rem;
      color: var(--text-sub);
      flex-shrink: 0;
      margin-top: 1px;
    }

    .btn-opt.correct {
      background: var(--success-bg) !important;
      border-color: var(--success) !important;
      color: #064e3b !important;
      font-weight: 600;
      animation: pop 0.25s ease;
    }
    .btn-opt.correct .opt-letter {
      background: var(--success);
      color: #ffffff;
    }

    .btn-opt.wrong {
      background: var(--danger-bg) !important;
      border-color: var(--danger) !important;
      color: #7f1d1d !important;
      animation: shake 0.3s ease;
    }
    .btn-opt.wrong .opt-letter {
      background: var(--danger);
      color: #ffffff;
    }

    .feedback-panel {
      margin-top: 20px;
      padding: 16px 20px;
      border-radius: 12px;
      background: #f8fafc;
      border-left: 4px solid var(--primary);
      font-size: 0.95rem;
      line-height: 1.5;
      display: none;
    }
    .feedback-panel.show { display: block; }

    .bottom-row {
      margin-top: 28px;
      display: flex;
      justify-content: flex-end;
    }
    .btn-action {
      padding: 13px 28px;
      background: var(--primary-gradient);
      color: #ffffff;
      border: none;
      border-radius: 12px;
      font-family: inherit;
      font-size: 0.98rem;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(79, 70, 229, 0.25);
      transition: all 0.2s;
    }
    .btn-action:hover:not(:disabled) {
      box-shadow: 0 6px 18px rgba(79, 70, 229, 0.35);
      transform: translateY(-1px);
    }
    .btn-action:disabled {
      background: #cbd5e1;
      box-shadow: none;
      cursor: not-allowed;
    }

    /* Màn hình Kết Quả */
    .result-box { text-align: center; padding: 20px 0; }
    .score-circle {
      width: 130px;
      height: 130px;
      border-radius: 50%;
      background: var(--primary-light);
      color: var(--primary);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin: 0 auto 20px auto;
      font-weight: 700;
      font-size: 2.2rem;
    }
    .score-circle span {
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text-sub);
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-6px); }
      40%, 80% { transform: translateX(6px); }
    }
    @keyframes pop {
      50% { transform: scale(1.02); }
    }
  </style>
</head>
<body>

<div class="container">
  <div class="card">
    
    <!-- MÀN HÌNH CHỌN MODULE -->
    <div id="menu-view">
      <div class="menu-header">
        <span class="badge-top">Học Liệu Tin Học Chuẩn</span>
        <h1>Ngân Hàng Trắc Nghiệm Ôn Tập</h1>
        <p>Hệ thống tự động xáo trộn ngẫu nhiên câu hỏi và các phương án mỗi lần mở</p>
      </div>
      <div class="module-list">
        <button class="btn-module" onclick="startQuiz('mod1')">
          <span>📖 Module 1: Hiểu biết về CNTT cơ bản</span>
          <span class="module-tag">29 câu</span>
        </button>
        <button class="btn-module" onclick="startQuiz('mod2')">
          <span>💻 Module 2: Sử dụng máy tính cơ bản (Windows)</span>
          <span class="module-tag">17 câu</span>
        </button>
        <button class="btn-module" onclick="startQuiz('mod3')">
          <span>📝 Module 3: Soạn thảo văn bản (MS Word)</span>
          <span class="module-tag">28 câu</span>
        </button>
        <button class="btn-module" onclick="startQuiz('mod4')">
          <span>📊 Module 4: Bảng tính điện tử (MS Excel)</span>
          <span class="module-tag">23 câu</span>
        </button>
        <button class="btn-module" onclick="startQuiz('mod5')">
          <span>📽️ Module 5: Trình chiếu cơ bản (PowerPoint)</span>
          <span class="module-tag">13 câu</span>
        </button>
        <button class="btn-module" onclick="startQuiz('mod6')">
          <span>🌐 Module 6: Sử dụng Internet cơ bản</span>
          <span class="module-tag">15 câu</span>
        </button>
      </div>
    </div>

    <!-- MÀN HÌNH LÀM BÀI TRẮC NGHIỆM -->
    <div id="quiz-view" style="display: none;">
      <div class="quiz-nav">
        <button class="btn-back" onclick="returnToMenu()">← Thoát ra danh sách bài</button>
        <div class="score-badge" id="hud-score">Điểm: 0</div>
      </div>

      <div class="progress-track">
        <div class="progress-bar" id="progress-bar"></div>
      </div>

      <div class="question-title" id="question-text">Câu hỏi đang tải...</div>
      <div class="options-box" id="options-box"></div>
      <div class="feedback-panel" id="feedback-panel"></div>

      <div class="bottom-row">
        <button class="btn-action" id="btn-next" onclick="nextQuestion()" disabled>Câu tiếp theo →</button>
      </div>
    </div>

    <!-- MÀN HÌNH TỔNG KẾT KẾT QUẢ -->
    <div id="result-view" class="result-box" style="display: none;">
      <div class="score-circle">
        <div id="final-percent">100%</div>
        <span>Chính xác</span>
      </div>
      <h2 style="margin: 0 0 8px 0;">Hoàn thành bài ôn tập!</h2>
      <p id="final-summary" style="color: var(--text-sub); margin-bottom: 26px; font-size: 1.05rem;"></p>
      <div style="display: flex; gap: 12px; justify-content: center;">
        <button class="btn-action" onclick="retryCurrent()">Làm lại bài này (Đổi câu mới)</button>
        <button class="btn-module" style="width: auto; padding: 13px 22px;" onclick="returnToMenu()">Chọn bài khác</button>
      </div>
    </div>

  </div>
</div>

<script>
// DỮ LIỆU ĐẦY ĐỦ 6 MODULE TIN HỌC
const rawModules = {

    { q: "1 bit dùng mấy ký tự nhị phân để biểu diễn:", options: ["1", "2", "3", "4"], correct: 0, explain: "1 bit chỉ biểu diễn 1 ký tự nhị phân duy nhất (0 hoặc 1)." },

    { q: "Trong các đơn vị đo thông tin sau, đơn vị đo thông tin nào lớn nhất?", options: ["Byte", "Bit", "Kilobyte", "Megabyte"], correct: 3, explain: "Megabyte lớn nhất trong 4 phương án trên." },
    { q: "Khi mất điện, các thông tin lưu trữ trong các phần nào sau đây bị mất:", options: ["RAM", "ROM", "CPU", "Đĩa cứng"], correct: 0, explain: "RAM là bộ nhớ khả biến, sẽ mất dữ liệu khi ngắt điện." },

    { q: "IM là tên viết tắt của:", options: ["Dịch vụ tin nhắn ngắn", "Tin nhắn tức thời", "Đàm thoại qua giao thức Internet", "Thư điện tử"], correct: 1, explain: "IM: Instant Messaging." },

// THUẬT TOÁN XÁO TRỘN FISHER-YATES CHUẨN
function shuffle(array) {
  const arr = [...array];
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

let activeKey = '';
let currentQuestions = [];
let currentIndex = 0;
let userScore = 0;
let isAnswered = false;

function startQuiz(key) {
  activeKey = key;
  const original = rawModules[key];
  
  // 1. Xáo trộn thứ tự các câu hỏi
  // 2. Xáo trộn thứ tự các đáp án trong từng câu
  currentQuestions = shuffle(original).map(item => {
    const correctText = item.options[item.correct];
    const shuffledOpts = shuffle(item.options);
    return {
      q: item.q,
      options: shuffledOpts,
      correct: shuffledOpts.indexOf(correctText),
      explain: item.explain
    };
  });

  currentIndex = 0;
  userScore = 0;

  document.getElementById("menu-view").style.display = "none";
  document.getElementById("result-view").style.display = "none";
  document.getElementById("quiz-view").style.display = "block";

  renderQuestion();
}

function retryCurrent() {
  startQuiz(activeKey);
}

function returnToMenu() {
  document.getElementById("quiz-view").style.display = "none";
  document.getElementById("result-view").style.display = "none";
  document.getElementById("menu-view").style.display = "block";
}

function renderQuestion() {
  isAnswered = false;
  const current = currentQuestions[currentIndex];

  // Cập nhật thanh tiến trình & HUD
  const progressPercent = ((currentIndex) / currentQuestions.length) * 100;
  document.getElementById("progress-bar").style.width = progressPercent + "%";
  document.getElementById("hud-score").innerText = `Câu ${currentIndex + 1}/${currentQuestions.length} • Đúng: ${userScore}`;
  document.getElementById("question-text").innerText = `${currentIndex + 1}. ${current.q}`;
  document.getElementById("btn-next").disabled = true;

  // Ẩn panel giải thích
  const feedback = document.getElementById("feedback-panel");
  feedback.className = "feedback-panel";
  feedback.innerText = "";

  // Tạo các nút phương án
  const box = document.getElementById("options-box");
  box.innerHTML = "";

  const labels = ["A", "B", "C", "D"];
  current.options.forEach((opt, idx) => {
    const btn = document.createElement("button");
    btn.className = "btn-opt";
    btn.innerHTML = `<span class="opt-letter">${labels[idx]}</span><span>${opt}</span>`;
    btn.onclick = () => chooseOption(idx, btn);
    box.appendChild(btn);
  });
}

function chooseOption(selectedIdx, btnElement) {
  if (isAnswered) return;
  isAnswered = true;

  const current = currentQuestions[currentIndex];
  const allButtons = document.querySelectorAll(".btn-opt");

  if (selectedIdx === current.correct) {
    btnElement.classList.add("correct");
    userScore++;
  } else {
    btnElement.classList.add("wrong");
    allButtons[current.correct].classList.add("correct");
  }

  // Khóa tất cả các nút
  allButtons.forEach(b => b.disabled = true);

  // Hiển thị phản hồi chi tiết
  const feedback = document.getElementById("feedback-panel");
  feedback.innerText = "💡 " + current.explain;
  feedback.classList.add("show");

  document.getElementById("hud-score").innerText = `Câu ${currentIndex + 1}/${currentQuestions.length} • Đúng: ${userScore}`;
  document.getElementById("btn-next").disabled = false;
}

function nextQuestion() {
  if (currentIndex < currentQuestions.length - 1) {
    currentIndex++;
    renderQuestion();
  } else {
    showResults();
  }
}

function showResults() {
  document.getElementById("progress-bar").style.width = "100%";
  document.getElementById("quiz-view").style.display = "none";
  document.getElementById("result-view").style.display = "block";

  const percent = Math.round((userScore / currentQuestions.length) * 100);
  document.getElementById("final-percent").innerText = percent + "%";
  document.getElementById("final-summary").innerText = `Bạn đã trả lời chính xác ${userScore}/${currentQuestions.length} câu hỏi.`;
}
</script>
