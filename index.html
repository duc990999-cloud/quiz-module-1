<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hệ Thống Ôn Tập Trắc Nghiệm Tin Học</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; max-width: 760px; margin: 30px auto; padding: 0 16px; background: #f1f5f9; color: #1e293b; }
    .quiz-card { background: white; padding: 28px; border-radius: 14px; box-shadow: 0 4px 14px rgba(0,0,0,0.06); }
    h2 { margin-top: 0; color: #0f172a; text-align: center; }
    .module-list { display: flex; flex-direction: column; gap: 12px; margin-top: 20px; }
    .btn-module { width: 100%; padding: 16px; background: #ffffff; border: 2px solid #e2e8f0; border-radius: 10px; font-size: 1.05rem; font-weight: 600; text-align: left; cursor: pointer; display: flex; justify-content: space-between; align-items: center; transition: all 0.2s ease; }
    .btn-module:hover { border-color: #4f46e5; background: #eef2ff; color: #4f46e5; transform: translateY(-1px); }
    .btn-module span.count { font-size: 0.85rem; font-weight: normal; background: #f1f5f9; padding: 4px 10px; border-radius: 20px; color: #64748b; }
    .question-title { font-size: 1.15rem; font-weight: 600; margin-bottom: 16px; line-height: 1.5; color: #0f172a; }
    .options { list-style: none; padding: 0; margin: 0; }
    .options li { margin-bottom: 10px; }
    .btn-option { width: 100%; text-align: left; padding: 13px 18px; border: 1.5px solid #cbd5e1; border-radius: 8px; background: white; cursor: pointer; font-size: 1rem; transition: 0.15s; line-height: 1.4; }
    .btn-option:hover { background: #f8fafc; border-color: #94a3b8; }
    .btn-option.correct { background: #dcfce7 !important; border-color: #22c55e !important; color: #15803d !important; font-weight: 600; }
    .btn-option.wrong { background: #fee2e2 !important; border-color: #ef4444 !important; color: #b91c1c !important; }
    .feedback { margin-top: 16px; padding: 14px; border-radius: 8px; font-size: 0.95rem; display: none; line-height: 1.4; }
    .feedback.show { display: block; background: #f8fafc; border-left: 4px solid #4f46e5; }
    .controls { margin-top: 22px; display: flex; justify-content: space-between; align-items: center; }
    .btn-next, .btn-primary { padding: 10px 22px; background: #4f46e5; color: white; border: none; border-radius: 7px; cursor: pointer; font-weight: 600; font-size: 0.95rem; }
    .btn-next:disabled { background: #cbd5e1; cursor: not-allowed; }
    .btn-back { background: none; border: none; color: #4f46e5; cursor: pointer; font-weight: 600; font-size: 0.95rem; padding: 0; }
    .btn-back:hover { text-decoration: underline; }
  </style>
</head>
<body>

<div class="quiz-card">
  <!-- MÀN HÌNH CHỌN MODULE -->
  <div id="menu-view">
    <h2>Chọn Bài Ôn Tập</h2>
    <p style="text-align: center; color: #64748b; margin-top: -6px; margin-bottom: 20px;">Trọn bộ 6 Module Kiến thức Tin học</p>
    <div class="module-list">
      <button class="btn-module" onclick="startQuiz('mod1')">
        <span>📖 Module 1: Hiểu biết về CNTT cơ bản</span>
        <span class="count">29 câu</span>
      </button>
      <button class="btn-module" onclick="startQuiz('mod2')">
        <span>💻 Module 2: Sử dụng máy tính cơ bản (Windows)</span>
        <span class="count">17 câu</span>
      </button>
      <button class="btn-module" onclick="startQuiz('mod3')">
        <span>📝 Module 3: Soạn thảo văn bản (MS Word)</span>
        <span class="count">28 câu</span>
      </button>
      <button class="btn-module" onclick="startQuiz('mod4')">
        <span>📊 Module 4: Bảng tính điện tử (MS Excel)</span>
        <span class="count">23 câu</span>
      </button>
      <button class="btn-module" onclick="startQuiz('mod5')">
        <span>📽️ Module 5: Trình chiếu cơ bản (MS PowerPoint)</span>
        <span class="count">13 câu</span>
      </button>
      <button class="btn-module" onclick="startQuiz('mod6')">
        <span>🌐 Module 6: Sử dụng Internet cơ bản</span>
        <span class="count">15 câu</span>
      </button>
    </div>
  </div>

  <!-- MÀN HÌNH THỰC HIỆN TRẮC NGHIỆM -->
  <div id="quiz-view" style="display: none;">
    <div style="display:flex; justify-content:space-between; align-items: center; margin-bottom: 14px; border-bottom: 1px solid #f1f5f9; padding-bottom: 10px;">
      <button class="btn-back" onclick="backToMenu()">⬅ Danh sách bài</button>
      <div style="color:#64748b; font-size:0.95rem;">
        <span id="progress">Câu 1</span> | <span id="score">Điểm: 0</span>
      </div>
    </div>
    
    <div class="question-title" id="question-text">Đang tải...</div>
    <ul class="options" id="options-list"></ul>
    <div class="feedback" id="feedback-box"></div>
    <div class="controls">
      <div></div>
      <button class="btn-next" id="next-btn" onclick="nextQuestion()" disabled>Câu tiếp theo</button>
    </div>
  </div>
</div>

};

let currentQuiz = [];
let currentIdx = 0;
let userScore = 0;
let isAnswered = false;

function startQuiz(modKey) {
  currentQuiz = allModules[modKey] || [];
  if (currentQuiz.length === 0) return;
  currentIdx = 0;
  userScore = 0;
  document.getElementById("menu-view").style.display = "none";
  document.getElementById("quiz-view").style.display = "block";
  renderQuestion();
}

function backToMenu() {
  document.getElementById("quiz-view").style.display = "none";
  document.getElementById("menu-view").style.display = "block";
}

function renderQuestion() {
  isAnswered = false;
  const item = currentQuiz[currentIdx];
  document.getElementById("progress").innerText = `Câu ${currentIdx + 1}/${currentQuiz.length}`;
  document.getElementById("score").innerText = `Điểm: ${userScore}`;
  document.getElementById("question-text").innerText = `${currentIdx + 1}. ${item.q}`;
  document.getElementById("next-btn").disabled = true;

  const fb = document.getElementById("feedback-box");
  fb.className = "feedback";
  fb.innerText = "";

  const list = document.getElementById("options-list");
  list.innerHTML = "";

  item.options.forEach((opt, idx) => {
    const li = document.createElement("li");
    const btn = document.createElement("button");
    btn.className = "btn-option";
    btn.innerText = opt;
    btn.onclick = () => handleSelect(idx, btn);
    li.appendChild(btn);
    list.appendChild(li);
  });
}

function handleSelect(selectedIdx, btnEl) {
  if (isAnswered) return;
  isAnswered = true;

  const item = currentQuiz[currentIdx];
  const allBtns = document.querySelectorAll(".btn-option");

  if (selectedIdx === item.correct) {
    btnEl.classList.add("correct");
    userScore++;
    document.getElementById("score").innerText = `Điểm: ${userScore}`;
  } else {
    btnEl.classList.add("wrong");
    allBtns[item.correct].classList.add("correct");
  }

  allBtns.forEach(b => b.style.pointerEvents = "none");

  const fb = document.getElementById("feedback-box");
  fb.innerText = "💡 Giải thích: " + item.explain;
  fb.classList.add("show");

  document.getElementById("next-btn").disabled = false;
}

function nextQuestion() {
  if (currentIdx < currentQuiz.length - 1) {
    currentIdx++;
    renderQuestion();
  } else {
    document.getElementById("quiz-view").innerHTML = `
      <div style="text-align:center; padding: 20px 0;">
        <h2 style="color: #0f172a;">Hoàn thành bài ôn tập!</h2>
        <p style="font-size: 1.3rem; margin: 15px 0;">Điểm số của bạn: <b style="color: #4f46e5;">${userScore}/${currentQuiz.length}</b></p>
        <div style="margin-top: 25px;">
          <button class="btn-primary" onclick="location.reload()">Chọn bài khác</button>
        </div>
      </div>
    `;
  }
}
</script>
